[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memstale"
version = "0.1.0"
description = "Temporal-aware long-term memory for AI agents: vector + graph hybrid retrieval with bitemporal facts and conflict soft-deprecation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sakya" }]
keywords = ["agent", "memory", "llm", "knowledge-graph", "rag", "bitemporal", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.dependencies]
numpy = ">=1.24"

[project.optional-dependencies]
graph = ["networkx>=3.0"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=7.0"]

[project.scripts]
memstale = "memstale.cli:main"

[tool.setuptools.packages.find]
include = ["memstale*"]
